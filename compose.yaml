services:
  api:
    build:
      context: ./api
    restart: unless-stopped
    environment:
      LINKIX_CORS_ORIGINS: ${LINKIX_CORS_ORIGINS:-http://localhost:5173}
      LINKIX_MAX_MEDIA_BYTES: ${LINKIX_MAX_MEDIA_BYTES:-104857600}
      LINKIX_MEDIA_HANDLE_TTL_SECONDS: ${LINKIX_MEDIA_HANDLE_TTL_SECONDS:-900}
      LINKIX_RESOLVE_LIMIT_PER_MINUTE: ${LINKIX_RESOLVE_LIMIT_PER_MINUTE:-10}
      LINKIX_MAX_PARALLEL_DOWNLOADS: ${LINKIX_MAX_PARALLEL_DOWNLOADS:-4}
      LINKIX_CONNECT_RETRIES: ${LINKIX_CONNECT_RETRIES:-4}
      LINKIX_BACKOFF_FACTOR: ${LINKIX_BACKOFF_FACTOR:-0.75}
      LINKIX_ENABLE_PARSER_FALLBACK: ${LINKIX_ENABLE_PARSER_FALLBACK:-false}
      LINKIX_PARSER_API: ${LINKIX_PARSER_API:-https://douyin.wtf/api/douyin/web/fetch_one_video}
      LINKIX_PARSER_TRUST_ENV: ${LINKIX_PARSER_TRUST_ENV:-true}
      LINKIX_DOUYIN_PROXY: ${LINKIX_DOUYIN_PROXY:-}
      LINKIX_KUAISHOU_PROXY: ${LINKIX_KUAISHOU_PROXY:-}
      LINKIX_YTDLP_PROXY: ${LINKIX_YTDLP_PROXY:-}
      LINKIX_BILIBILI_PROXY: ${LINKIX_BILIBILI_PROXY:-}
      LINKIX_FFMPEG_PATH: ${LINKIX_FFMPEG_PATH:-ffmpeg}
      LINKIX_FFPROBE_PATH: ${LINKIX_FFPROBE_PATH:-ffprobe}
    ports:
      - "127.0.0.1:8010:8010"
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    security_opt:
      - no-new-privileges:true
